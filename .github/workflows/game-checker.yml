name: Weekly Game Health Check
on:
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  check-games:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - name: Start dev server
        run: node server.js &
      - name: Wait for server
        run: |
          for i in $(seq 1 30); do
            curl -s http://localhost:3000 > /dev/null && break || sleep 2
          done
      - name: Run game health checks
        run: node scripts/ci-game-tester.mjs
      - name: Create issue for broken games
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reports = fs.readdirSync('reports').filter(f => f.startsWith('ci-game-check-'));
            if (!reports.length) return;
            const latest = reports.sort().pop();
            const data = JSON.parse(fs.readFileSync(`reports/${latest}`));
            const broken = data.results.filter(r => r.status === 'broken');
            if (!broken.length) {
              console.log('No broken games found!');
              return;
            }
            const rows = broken.map(g => `| ${g.slug} | ${g.reason} | [Link](https://jeoweb.app/Assets/${g.slug}/index.html) |`).join('\n');
            const body = `## 🔴 Broken Games Detected\n\n| Game | Reason | Link |\n|---|---|---|\n${rows}\n\n*Auto-generated by game-checker workflow on ${new Date().toISOString()}*`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🔴 Broken Games Detected — ${new Date().toISOString().split('T')[0]}`,
              body,
              labels: ['broken-games', 'automated']
            });
      - name: Commit reports
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/
          git diff --cached --quiet || git commit -m 'ci: weekly game health check results'
          git push
