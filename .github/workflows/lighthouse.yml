name: Lighthouse CI

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["claude/website-improvement-plan-*"]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Generate catalog
        run: node scan.js

      - name: Build site
        run: npx astro build

      - name: Run Lighthouse CI
        run: |
          npm i -g @lhci/cli@0.13.x
          lhci autorun --config=./lighthouserc.json || echo "Lighthouse soft-failed (Sprint 0 — gates land in Sprint 6)"
