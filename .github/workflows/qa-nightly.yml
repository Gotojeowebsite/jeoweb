name: QA Nightly (scan + auto-recover)

on:
  schedule:
    # 04:00 UTC nightly.
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      max_recoveries:
        description: 'Maximum number of broken games the recovery engine should attempt this run (0 = no limit)'
        required: false
        default: '0'
      workers:
        description: 'Recovery workers in parallel (default 3)'
        required: false
        default: '3'
      skip_recovery:
        description: 'Skip the recovery engine (scan only)'
        required: false
        default: 'false'
      skip_confirm_pass:
        description: 'Skip the 2nd-pass confirm-broken scan (faster but less accurate)'
        required: false
        default: 'false'
      skip_profile_b:
        description: 'Skip the chromium-no-gpu profile scan (the headless_b lane in the 5-lane verdict)'
        required: false
        default: 'false'
  push:
    # Manual one-shot trigger. Push to either:
    #   * a tag matching qa-run-*  (preferred — never recurses)
    #   * the recovery-engine branch claude/game-qa-offline-system-Vz4SS
    #     (lets the engine be exercised end-to-end before merging to main).
    # The PR opened by this workflow targets a fresh qa/nightly-<id> branch,
    # not this one, so no re-fire when it lands.
    tags:
      - 'qa-run-*'
    branches:
      - 'claude/game-qa-offline-system-Vz4SS'

permissions:
  contents: write
  pull-requests: write
  issues: write
  # actions:write is needed so the final step can dispatch static.yml via
  # the workflow_dispatch API. Without it, the Pages deploy never fires
  # when qa-nightly commits to main (push events authored by GITHUB_TOKEN
  # are intentionally blocked from triggering other workflows by GitHub).
  actions: write

concurrency:
  group: qa-nightly
  cancel-in-progress: false

jobs:
  nightly:
    runs-on: ubuntu-latest
    # GitHub-hosted runners enforce a 6h (360 min) job ceiling on the free
    # tier; the per-step timeouts below sum to ~350 min to leave a buffer.
    # Step caps (in order): setup 15 + pass1 110 + pass2 150 + recovery 130
    # + pass3 rescan 45 + commit 10 = 460. The actual durations are bounded
    # tighter by the --time-budget flags so we don't hit this ceiling in
    # the common case — pass 2's longer cap is wallclock headroom, not
    # expected runtime.
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # No explicit ref so the workflow runs against whatever triggered it:
        #   - cron / workflow_dispatch defaults: default branch (main)
        #   - push of qa-run-* tag: the tagged commit (use this to test the
        #     pipeline before merging the recovery-engine branch into main)

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Node deps
        run: npm ci || npm install

      - name: Install Playwright (chromium only)
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Refresh games_list.json
        run: node scan.js

      - name: Static health scan
        run: node scripts/static-health-scan.js

      - name: Build current game_health.json
        run: node scripts/build-game-health.js

      - name: Build offline manifests for current catalog
        run: node scripts/build-offline-manifest.js --all

      - name: Headless Playwright scan (pass 1, full catalog)
        timeout-minutes: 110
        # Pass 1 is fast triage. Pass 2 below is the thorough confirm pass
        # that re-scans only the broken set with longer waits + retries.
        # See broken_game_scanner.py's compute_engine_extra_wait_ms — Unity
        # already gets up to 35s extra on top of --wait-seconds.
        run: |
          rm -f scan_state.json || true
          python3 broken_game_scanner.py \
            --parallel-workers 4 \
            --state-file scan_state.json \
            --sync-markers \
            --hard-timeout-seconds 180 \
            --wait-seconds 12 \
            --timeout-ms 45000

      - name: Build interim game_health.json (after pass 1)
        run: node scripts/build-game-health.js

      - name: Pass 2 — re-scan everything flagged broken to confirm
        # Many "broken" verdicts in pass 1 are transient flakes: a slow CDN,
        # a worker crash, a Unity build that needed one more second. Re-scan
        # only those slugs in parallel with longer per-game wait + retries so
        # we don't bake a flake into the verdict, but don't run sequentially
        # — with 100+ broken games even at 1 worker pass 2 blew its budget.
        if: ${{ github.event.inputs.skip_confirm_pass != 'true' }}
        timeout-minutes: 150
        run: |
          BROKEN_COUNT=$(node -e "
            const fs=require('fs');
            const h=JSON.parse(fs.readFileSync('game_health.json','utf-8'));
            const g=h.games||{}; let n=0;
            for (const k in g) if (g[k].verdict==='broken' && g[k].source!=='override') n++;
            console.log(n);
          ")
          echo "pass-1 reported $BROKEN_COUNT broken games — re-confirming with parallel-workers 3"
          if [ "$BROKEN_COUNT" = "0" ]; then exit 0; fi
          python3 broken_game_scanner.py \
            --only-from game_health.json \
            --parallel-workers 3 \
            --state-file scan_confirm_state.json \
            --sync-markers \
            --hard-timeout-seconds 180 \
            --wait-seconds 22 \
            --timeout-ms 60000 \
            --max-attempts 2
          node scripts/build-game-health.js

      - name: Pass 1b — full-catalog scan on chromium-no-gpu profile (headless_b lane)
        # The triple-confirm verdict in scripts/build-game-health.js merges
        # signals from up to 5 lanes (static, cdn_probe, headless, headless_b,
        # smoke). This step produces the headless_b lane by re-scanning the
        # whole catalog with --disable-gpu --disable-software-rasterizer,
        # catching games whose canvas rendering depends on a specific GPU
        # path. Output goes to scan_results.profile_b.json so it doesn't
        # clobber the default-profile results. Shorter waits than pass 1
        # because we only care about divergence, not nailing down details.
        if: ${{ github.event.inputs.skip_profile_b != 'true' }}
        timeout-minutes: 110
        run: |
          rm -f scan_state_profile_b.json || true
          python3 broken_game_scanner.py \
            --profile chromium-no-gpu \
            --parallel-workers 4 \
            --state-file scan_state_profile_b.json \
            --hard-timeout-seconds 150 \
            --wait-seconds 10 \
            --timeout-ms 40000 \
            --report-json scan_results.profile_b.json

      - name: Build game_health.json with all 5 lanes
        run: node scripts/build-game-health.js

      - name: Run aggressive recovery engine
        if: ${{ github.event.inputs.skip_recovery != 'true' }}
        env:
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        timeout-minutes: 130
        run: |
          MAX_REC="${{ github.event.inputs.max_recoveries }}"
          WORKERS="${{ github.event.inputs.workers }}"
          : "${MAX_REC:=0}"
          : "${WORKERS:=3}"
          MAX_FLAG=""
          if [ "$MAX_REC" != "0" ] && [ -n "$MAX_REC" ]; then MAX_FLAG="--max $MAX_REC"; fi
          echo "running recovery: max=${MAX_REC:-unlimited} workers=$WORKERS"
          # --include-cooldowns forces all broken slugs to be attempted at
          # least once, ignoring per-slug cooldowns. The user asked for
          # "by any means necessary" — that means try every broken game
          # every run.
          node scripts/recover-all-broken.js \
            --workers "$WORKERS" $MAX_FLAG \
            --include-cooldowns \
            --time-budget 110m || true

      - name: Re-scan slugs touched by recovery (gold-standard verdict)
        if: ${{ github.event.inputs.skip_recovery != 'true' }}
        timeout-minutes: 45
        run: |
          REPORT=$(ls -t reports/recovery_summary_*.json 2>/dev/null | head -1)
          if [ -z "$REPORT" ]; then
            echo "no recovery summary, skipping rescan"
            exit 0
          fi
          python3 broken_game_scanner.py --only-from "$REPORT" --sync-markers \
            --parallel-workers 3 \
            --hard-timeout-seconds 180 --wait-seconds 18 \
            --timeout-ms 45000 \
            --max-attempts 2 || true

      - name: Localize externals + auto-inject Poki shim
        run: node scripts/localize-all-games.js --apply

      - name: Rebuild offline manifests
        run: node scripts/build-offline-manifest.js --all

      - name: Final game_health rebuild
        run: |
          node scan.js
          node scripts/static-health-scan.js
          node scripts/build-game-health.js

      - name: Refresh qa_baseline.json
        run: |
          node -e "
            const fs=require('fs');
            const h=JSON.parse(fs.readFileSync('game_health.json','utf-8'));
            const broken=(h.counts && h.counts.broken) || 0;
            fs.writeFileSync('qa_baseline.json', JSON.stringify({
              broken_at_main: broken,
              generated_at: Math.floor(Date.now()/1000),
              source: 'qa-nightly'
            }, null, 2));
            console.log('baseline broken='+broken);
          "

      - name: Commit + push results to the source branch
        # Pushes recovered games / refreshed scan + manifest output directly
        # to whatever ref triggered the workflow. When triggered by a push to
        # claude/game-qa-offline-system-Vz4SS the changes show up on PR #8
        # automatically. For nightly cron / dispatch on main this commits to
        # main.
        #
        # NOTE: GitHub Actions does NOT re-trigger workflows on pushes
        # authored by the built-in GITHUB_TOKEN. That means:
        #   - qa-nightly won't recursively fire on its own commit (good)
        #   - .github/workflows/static.yml (Pages deploy) ALSO won't fire on
        #     it (bad — broke the deploy). That's why the next step
        #     explicitly invokes static.yml via the workflow_dispatch API.
        id: commit_push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          # Figure out which branch we're on. github.ref is "refs/heads/<x>"
          # for branch pushes / workflow_dispatch / schedule; for tag pushes it
          # would be "refs/tags/<x>" and we should commit to main in that case.
          REF='${{ github.ref }}'
          case "$REF" in
            refs/heads/*) BRANCH="${REF#refs/heads/}";;
            refs/tags/*)  BRANCH='main';;
            *)            BRANCH='main';;
          esac
          echo "target branch: $BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          # Stage the catalog + verdict + manifest output. Keep "git add -A"
          # scoped to paths that the QA pipeline owns so we don't sweep in
          # accidental working-tree changes from earlier steps.
          git add -A \
            Assets \
            games_list.json recently_added.json \
            scan_results.json broken_games.json broken_games.txt \
            checked_games.txt working_games.txt needs_review_games.txt \
            static_health.json game_health.json override_conflicts.json \
            qa_baseline.json maintenance_status.json \
            reports || true

          if git diff --cached --quiet; then
            echo "No changes to commit — recovery engine produced nothing new."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "qa: nightly scan + recovery (run ${{ github.run_id }})" \
                     -m "Auto-generated by .github/workflows/qa-nightly.yml. See reports/recovery_summary_*.json and the workflow run artifacts for details."

          # Push to whichever branch triggered us; use the workflow's GITHUB_TOKEN
          # which has contents:write permission via the workflow's permissions block.
          REMOTE_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          # Retry on transient 5xx.
          for attempt in 1 2 3 4; do
            if git push "$REMOTE_URL" "HEAD:$BRANCH"; then
              echo "Pushed to $BRANCH on attempt $attempt"
              echo "committed=true" >> "$GITHUB_OUTPUT"
              break
            fi
            echo "Push failed (attempt $attempt); sleeping..."
            sleep $((attempt * 4))
          done

      - name: Trigger Pages deploy (static.yml) on main
        # GitHub blocks GITHUB_TOKEN pushes from firing other workflows, so the
        # prior step's commit doesn't auto-trigger the Pages build. workflow_dispatch
        # IS allowed for GITHUB_TOKEN (the only event type that is) — invoke it
        # explicitly. Only fires when:
        #   - we actually committed something this run, AND
        #   - the commit landed on main (Pages only deploys from main).
        if: |
          steps.commit_push.outputs.committed == 'true'
          && steps.commit_push.outputs.branch == 'main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          echo "dispatching .github/workflows/static.yml on main..."
          HTTP_STATUS=$(curl -sS -o /tmp/dispatch_resp.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/static.yml/dispatches" \
            -d '{"ref":"main"}')
          echo "HTTP $HTTP_STATUS"
          cat /tmp/dispatch_resp.json || true
          # 204 = success (workflow dispatched). Anything else: surface the body
          # and fail the step so it's visible in the run log.
          if [ "$HTTP_STATUS" != "204" ]; then
            echo "::error::Failed to dispatch static.yml (HTTP $HTTP_STATUS)"
            exit 1
          fi
          echo "Pages deploy successfully dispatched."

      - name: Upload pipeline reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-nightly-reports-${{ github.run_id }}
          path: |
            reports/**
            scan_results.json
            game_health.json
            static_health.json
            broken_games.json
            recovery_summary_*.json
          if-no-files-found: ignore
