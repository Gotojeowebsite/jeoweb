name: Deploy backend Worker

# Auto-deploys the Cloudflare Worker (backend/) on any push that touches it,
# and runs the D1 schema migration first. The schema uses CREATE TABLE IF
# NOT EXISTS, so re-running is safe and idempotent.
#
# One-time setup:
#   1. Cloudflare → My Profile → API Tokens → Create Token (see README)
#   2. GitHub → repo Settings → Secrets and variables → Actions:
#        - CLOUDFLARE_API_TOKEN  = the token from step 1
#        - CLOUDFLARE_ACCOUNT_ID = your Cloudflare account ID
on:
  push:
    branches:
      - main
      - 'claude/**'
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # CREATE TABLE IF NOT EXISTS everywhere, so this is a safe no-op on
      # subsequent runs when the schema hasn't changed.
      - name: Apply D1 schema (idempotent)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest d1 execute jeoweb --file=schema.sql --remote

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest deploy
