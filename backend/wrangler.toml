# Cloudflare Worker config for the Jeoweb backend.
# This Worker is deployed INDEPENDENTLY of the static site — it is never part
# of the GitHub Pages / Azure artifact. See backend/README.md for full steps.

name = "jeoweb-backend"
main = "worker.js"
compatibility_date = "2026-01-01"

# D1 (SQLite) database binding. Create the DB first with:
#   wrangler d1 create jeoweb
# then paste the printed database_id below.
[[d1_databases]]
binding = "DB"
database_name = "jeoweb"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

# Cron trigger for the Phase 5 daily reminder push. 16:00 UTC ≈ a late-
# afternoon nudge in the Americas; adjust to suit your audience.
[triggers]
crons = ["0 16 * * *"]

# --- Optional secrets (set with `wrangler secret put <NAME>`) ---
# SCORE_SIGNING_KEY  — enables HMAC-verified score submission (Phase 4).
#                      Set the same value in <meta name="jeo-score-key">.
# VAPID_PUBLIC_KEY   — web-push VAPID keys for daily reminders (Phase 5).
# VAPID_PRIVATE_KEY    Generate with:  npx web-push generate-vapid-keys
#                      Put the public key in <meta name="jeo-vapid-key">.
# VAPID_SUBJECT      — a mailto: or https: contact URL for VAPID (optional).
