	<text x="96" y="410" font-family="Inter, sans-serif" font-size="44" font-weight="600" fill="#fafaf9">596 unblocked games · zero downloads</text>
	<text x="96" y="460" font-family="Inter, sans-serif" font-size="28" font-weight="400" fill="#c9c8d3">Browser, Flash, retro — instant play, even offline.</text>

