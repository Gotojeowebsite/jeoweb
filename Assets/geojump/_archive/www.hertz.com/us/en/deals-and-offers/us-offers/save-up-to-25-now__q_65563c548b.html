            var successDelayMs = options?.successDelayMs ?? 1000;
            const eventName = "ComponentReady";

            if (isDebug && !Array.isArray(expected) || expected.length === 0) {
                console.log("[watchComponentsReady]: no expected components specified");
            }

            var received = new Set();
            var done = false;
            var resolveFn;
            var timeoutId;

            function finish(reason, isSuccess) {
                if (done) return;
                done = true;

                window.removeEventListener(eventName, listener);
                if (timeoutId) clearTimeout(timeoutId);

                // Internal wrapper to execute shared logic + promise resolution
                const completeProcess = function() {
                    window.prerenderReady = true;
                    resolveFn({reason: reason});
                };

                if (isSuccess && successDelayMs > 0) {

                    setTimeout(completeProcess, successDelayMs);
                } else {
                    completeProcess();
                }
            }


            function listener(event) {
                var componentName = event && event.detail && event.detail.componentName;
                if (expected.indexOf(componentName) === -1) return;

                    }

        // For ABP protection
        const tokenFetchFactory = function () {
            let protectionCache = null;
            const waitingOnProtection = [];

            window.protectionLoaded = function (protection) {
                protectionCache = protection;
                for (const resolve of waitingOnProtection) {
                    resolve(protection);
                }
                waitingOnProtection.length = 0;
            };
            function protectionObject(jsTimeout = 1000) {
                if (protectionCache !== null) {
                    return Promise.resolve(protectionCache);
                }

                return new Promise((resolve) => {
                    waitingOnProtection.push(resolve);

                    const timeout = setTimeout(
                        () => {
                            resolve(null);
                        },
                        jsTimeout,
                    );
                });
            }

            const getToken = function (jsTimeout = 1000, tokenTimeout = 1000) {
                return protectionObject(jsTimeout)
                    .then((protection) => {
                    if (protection === null) {
                        return null;
                    } else {
                        return protection
                        .token(tokenTimeout)
                        .catch(() => {
                            return null;
                        });
                    }
                });
            };

            return getToken;
        };

        window.getAbpToken = tokenFetchFactory();
