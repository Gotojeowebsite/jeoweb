<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Google Auth</title>
        <link href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css" rel='stylesheet'/>
    </head>
    <body style="margin:0;padding:0;">
		<script>
			function parseJwt (token) {
				var base64Url = token.split('.')[1];
				var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
				var jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
					return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
				}).join(''));

				return JSON.parse(jsonPayload);
			}

			function processResponse(user, token) {
				return {
					id: user.sub,
					name: user.name,
					first_name: user.given_name,
					last_name: user.family_name,
					email: user.email,
					access_token: token
				}
			}

			function handleCredentialResponse(data) {
				if(data.credential)
				{
					let user = parseJwt(data.credential);
					console.log(user);
					window.parent.postMessage({
						action: 'auth-google-user',
						user: processResponse(user, data.credential)
					}, '*');
				}
				console.log(data);
			}
		</script>
		<script id="google-button-script" async defer></script>
		<div id="g_id_onload"
			data-client_id=""
			data-callback="handleCredentialResponse"
			data-auto_prompt="false"
		 	data-type="standard"
         	data-size="large"
         	data-theme="filled_blue"
         	data-text="signin_with"
         	data-shape="rectangular"
         	data-logo_alignment="left"
		</div>
		<div id="g_id_signin" class="g_id_signin" 
			data-type="standard"
		    data-size="large"
         	data-theme="filled_blue"
         	data-text="signin"
         	data-shape="rectangular"
         	data-logo_alignment="left"
			style="overflow: hidden"></div>
		
		<script>
			if (window.addEventListener) {
				window.addEventListener('message', onMessage, false);
				
			} else {
				window.attachEvent('onmessage', onMessage);
			}

			function onMessage(msg) {
				console.debug(msg);
				if (msg.data.type === 'EAGLE_BUTTON') {
					setEagleButton(msg.data.payload);
				}

				if (msg.data.type === "DEFAULT_BUTTON") {
					setGoogleButtonScriptSrc(msg.data.payload.innerWidth);
				}

				if (msg.data.type === "GOOGLE_APP_ID") {
					console.debug(msg.data.payload)
					document.getElementById("g_id_onload").setAttribute("data-client_id", msg.data.payload.googleAppId);
				}
			}

			function setEagleButton(payload) {
				if (payload) {
					const {innerWidth} = payload;
					setGoogleButtonScriptSrc(innerWidth);
					makeGoogleButtonPill();
				}
			}	
			function setGoogleButtonScriptSrc(innerWidth) {
 				if (innerWidth <= 768) {
					setWidthToGoogleButton(164);
				}
				else {
					setWidthToGoogleButton(210);
				}
				const googleButtonScript = document.getElementById('google-button-script');
				googleButtonScript.src = "https://accounts.google.com/gsi/client";
			}
			function setWidthToGoogleButton(pixels) {
				document.getElementById("g_id_onload").setAttribute("data-width", String(pixels));
				document.getElementById("g_id_signin").setAttribute("data-width", String(pixels));
			}
			function makeGoogleButtonPill() {
				document.getElementById("g_id_onload").setAttribute("data-shape", "pill");
				document.getElementById("g_id_signin").setAttribute("data-shape", "pill");
			}
		</script>
		
    </body>

</html>
