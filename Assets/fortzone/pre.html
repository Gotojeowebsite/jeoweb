<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Game</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    .game {
      position: relative;
      width: 100%;
      height: 100%;
    }

    #gameFrame {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>

<body>
  <div class="game">
    <iframe
      id="gameFrame"
      data-src="./index.html"
      src="./index.html"
      width="100%"
      height="100%"
      marginwidth="0"
      marginheight="0"
      hspace="0"
      vspace="0"
      frameborder="0"
      scrolling="no"
      webkitallowfullscreen="true"
      mozallowfullscreen="true"
      msallowfullscreen="true"
      allowfullscreen="true">
    </iframe>
  </div>
</body>
</html>
