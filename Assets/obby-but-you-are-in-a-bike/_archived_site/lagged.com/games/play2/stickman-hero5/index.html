// DOM elements
const CANVAS = document.querySelector('#c');

const BTN_ROPE = document.querySelector('#btnRope');

const GO_KILLS = document.querySelector('#goKills');

function preload() {
    const progressbarElem = document.querySelector('#progressbar');
    let manager = new THREE.LoadingManager();
    manager.onStart = function ( url, itemsLoaded, itemsTotal ) {
        //console.log( 'Started loading file: ' + url + '.\nLoaded ' + itemsLoaded + ' of ' + itemsTotal + ' files.' );
    };
    manager.onLoad = function ( ) {
        //console.log( 'Loading complete!');
        
        // hide the loading bar
        const loadingElem = document.querySelector('#loading');
        loadingElem.style.display = 'none';

        setTimeout(function(){
            LaggedAPI.APIAds.show(function() {
                init();
                document.getElementById('loading').style.display = 'none';
            });
        },1500);


    };
    manager.onProgress = function ( url, itemsLoaded, itemsTotal ) {
        //console.log( 'Loading file: ' + url + '.\nLoaded ' + itemsLoaded + ' of ' + itemsTotal + ' files.' );
        progressbarElem.style.width = `${itemsLoaded / itemsTotal * 100 | 0}%`;
        PROGRESS_TEXT.innerHTML = `${itemsLoaded / itemsTotal * 100 | 0}%`;
    };
    manager.onError = function ( url ) {
        //console.log( 'There was an error loading ' + url );
    };

    var loader = new THREE.FBXLoader( manager );
    // load base character model
    for (const model of Object.values(BaseModel)) {
        loader.load( model.url, function ( fbx ) {
            model.fbx = fbx;
        });
    }
    // load anims
    for (const model of Object.values(Anims)) {
        loader.load( model.url, function ( fbx ) {
            //model.fbx = fbx;
            model.animation = fbx.animations[ 0 ];
        });
    }
    // load textures
    var loaderTex = new THREE.TextureLoader(manager);
    for (const img of Object.values(Textures)) {
        loaderTex.load( img.url, function(texture) {
            texture.encoding = THREE.sRGBEncoding;
            img.texture = texture;
        });
    }
    // load audio
    Sound.listener = new THREE.AudioListener();
    const audioLoader = new THREE.AudioLoader( manager );
    for (const key of Object.values(Sound)) {
        audioLoader.load( key.url, function(buffer) {
            key.sound = new THREE.Audio( Sound.listener );
            key.sound.setBuffer( buffer );
            key.sound.setVolume( 2 );
            if (key.url == 'Sound/music.mp3'){
                key.sound.setLoop( true );
                key.sound.setVolume( 0.36 );
            }
            else if (key.url == 'Sound/walk.mp3'){
                key.sound.setLoop( true );
                key.sound.setVolume( 3.5 );
            }
        });
    }
    // load character
    loader.load( 'Models/stickman.fbx', function( object ) {
        object.traverse(function(child) {
            if (child instanceof THREE.Mesh) {
                const oldMat = child.material;
                child.material = new THREE.MeshBasicMaterial( {
                    color: oldMat.color,
                    skinning: true,
                });
            }

        });
        object.scale.set(0.2,0.2,0.2);
        //object.rotation.y += THREE.Math.degToRad(180);
        playerModel.model = object;
        playerModel.animation = object.animations[0];
    });
    // SKYBOX

function Spawner() {
    var self = {
        levelWidth: 6000,
        levelHeight: 6000,
        enemyBoss: null,
        gameStarted: false,
    }
    self.init = function(){
        self.spawnEnemy();
    }
    self.spawnEnemy = function(type){
        if (!self.enemyBoss){
            let spawnX, spawnZ;
            if (player.group.position.x < self.levelWidth/2)// player's left side of map
                spawnX = rand(self.levelWidth/2, self.levelWidth)
            else
                spawnX = rand(0, self.levelWidth/2)// player's right

            if (player.group.position.z < self.levelHeight/2)// player's bottom
                spawnZ = rand(self.levelHeight/2, self.levelHeight)
            else
                spawnX = rand(0, self.levelHeight/2)// player's top

            let enemy = new Enemy(new THREE.Vector3(500-spawnX,0,spawnZ));
            self.enemyBoss = new THREE.Vector3(500-spawnX,0,spawnZ);
        }
        else {
            let enemy = new Enemy(new THREE.Vector3(self.enemyBoss.x+rand(-200,200),0,self.enemyBoss.z+rand(-200,200)));
        }
        self.gameStarted = true;
    }
    self.levelFX = function(type){
        LEVEL.innerHTML = "Level "+level;
        LEVEL.classList.add('animate__animated', 'animate__tada');
        LEVEL.addEventListener('animationend', removeMenu);
        function removeMenu() {
            LEVEL.removeEventListener('animationend', removeMenu);
            LEVEL.classList.remove('animate__animated', 'animate__tada');
        }
    }
    self.update = function(dt){
        if (self.gameStarted && enemiesArray.length == 0){
            Sound.level_complete.sound.play();
            level ++;
            callConfetti();
            self.levelFX();
            self.enemyBoss = null;
            for (let i = 1; i <= level; i ++){
                self.spawnEnemy();
            }
        }
    }
    self.init();
    updateArray.push(self);
    return self;
}

// HELPER FUNCTIONS
function rand(min, max) {
    min = Math.ceil(min);
    max = Math.floor(max);
    return Math.floor(Math.random() * (max - min + 1)) + min; //The maximum is inclusive and the minimum is inclusive
}

// ACTUAL GAME
function animate(){
    requestAnimationFrame( animate );
    var delta = clock.getDelta();
    if (delta > 2){
        delta = 0;
    }

    for (let i in updateArray){
        updateArray[i].update(delta);
    }
    for (let i in particleArray){
        particleArray[i].update(delta);
    }
    for (let i in bloodFXArr){
        bloodFXArr[i].update();
    }
    for (let i in hitfxArray){
        hitfxArray[i].update(1000*delta);
    }
    for (let i in bulletFX){
        bulletFX[i].update(delta);
    }

    for (let i in collisionArray){
        collisionArray[i].boundingBox.setFromObject(collisionArray[i]);
        collisionArray[i].box3.setFromObject(collisionArray[i]);
    }

    if (!shadowsRendered){
        renderer.shadowMap.needsUpdate = true; // when scene changes
        shadowsRendered = true;
    }

    touchSpin();
    touchControls();

    showLandscapeMessage();
    renderer.render( scene, camera );
}

function callConfetti() {
    var duration = 2 * 40;
    var end = Date.now() + duration;

    (function frame() {
        // launch a few confetti from the left edge
        confetti({
            particleCount: 7,
            angle: 60,
            spread: 55,
            origin: { x: 0 }
        });
        // and launch a few from the right edge
        confetti({
            particleCount: 7,
            angle: 120,
            spread: 55,
            origin: { x: 1 }
        });

        // keep going until we are out of time
        if (Date.now() < end) {
            requestAnimationFrame(frame);
        }
    }());

    confetti({
        particleCount: 150,
        spread: 180
    });
}

var previousEvent = {screenX: 0, screenY: 0};
var touchId = -1;
var movementX = 0;
var movementY = 0;

function touchStart(event) {
    //event.preventDefault();
    let touch = event.changedTouches[0];
    /*if( touch.pageX >= window.innerWidth/2 ){*/
        previousEvent.screenX = touch.pageX;
        previousEvent.screenY = touch.pageY;
        touchId = touch.identifier;
    /*}*/
     if (!Sound.music.sound.isPlaying){
        Sound.music.sound.play();
    }
}

function touchMoved(event) {
    //event.preventDefault();
    if (player && touchId != -1 ){
        for (let i in event.changedTouches){
            if ( event.changedTouches[i].identifier == touchId){
                let touch	= event.changedTouches[i];
                movementX = touch.pageX - previousEvent.screenX;
                movementY = touch.pageY - previousEvent.screenY;
            }
        }
        //player.cameraMove(movementX*0.04,movementY*0.04);
    }
}

function touchSpin(){
    if (touchId != -1 && movementX != 0 && movementY != 0){
        player.cameraMove(movementX*0.2,movementY*0.2);
    }
}

function touchEnd(event) {
    //event.preventDefault();
    for (let i in event.touches){
        if(event.touches[i].identifier == touchId){
            return;
        }
    }
    touchId = -1;
    movementX = 0;
    movementY = 0;
}

function mouseDown(event) {
    if (!gameOver){
        if (event.button == 0){ // Left click
            input.shoot = true;
            if (!touchDevice)
                document.body.requestPointerLock();
        }
        else {
            if (player)
                player.ropeThrow();
        }
    }
     if (!Sound.music.sound.isPlaying){
        Sound.music.sound.play();
    }
}

function mouseUp(event) {
    input.shoot = false;
}

document.onkeydown = function(e) {
    switch (e.keyCode) {
        case 32:
            if (!e.repeat)
                input.jump = 1;//Space
            break;
        case 65:
            input.sideways = -1;//A
            break;
        case 87:
            input.forward = 1;// W
            break;
        case 68:
            input.sideways = 1;//D
            break;
        case 83:
            input.forward = -1;// S
            break;
    }
}

document.onkeyup = function(e) {
    switch (e.keyCode) {
        case 65:
            if (input.sideways == -1)
                input.sideways = 0;//left
            break;
        case 87:
            input.forward = 0;// up
            break;
        case 68:
            if (input.sideways == 1)
                input.sideways = 0;//right
            break;
        case 83:
            input.forward = 0;// down
            break;
    }
}

function touchControls() {
    if (!joystick) return;

    if ( joystick.left() ) {
        input.sideways = -1;
    }
    else if (input.sideways == -1) {
        input.sideways = 0;
    }
    if ( joystick.right() ) {
        input.sideways = 1;
    }
    else if (input.sideways == 1){
        input.sideways = 0;
    }
    if ( joystick.up() ) {
        input.forward = 1;
    }
    else if (input.forward == 1){
        input.forward = 0;
    }
    if ( joystick.down() ) {
        input.forward = -1;
    }
    else if (input.forward == -1){
        input.forward = 0;
    }
}

            }
        });

        // prop-GUN

        self.shadow = new THREE.Mesh(circleGeometry, shadowMaterial);

    self.move = function(dt) {
        if (input.forward == 1){
            self.spdZ = self.speed;
        }
        else if (input.forward == -1){
            self.spdZ = -self.speed;
        }
        else
            self.spdZ = 0;

        if (input.sideways == 1){
            self.spdX = -self.speed;
        }
        else if (input.sideways == -1){
            self.spdX = self.speed;
        }
        else
            self.spdX = 0;

        if (self.spdZ != 0 || self.spdX != 0){
            if (!self.ropeClimbing) {
                self.group.translateZ(dt*self.spdZ);
                self.group.translateX(dt*self.spdX);
            }
        }

        // jumping
        if (!self.ropeClimbing) {
            self.group.position.y += dt*self.velocityY;
            if (self.oppositeZ)
                self.group.position.z += dt*self.velocityZ;
            else
                self.group.position.z -= dt*self.velocityZ;

            if (self.velocityZ > 0)
                self.velocityZ -= dt*self.gravity;
            if (self.velocityZ <= 0){
                self.velocityZ = 0;
                self.oppositeZ = false;
            }


            // bottom raycast gravity etc
            let dir = new THREE.Vector3();
            var pos = self.model.position.clone();
            pos.applyMatrix4(self.group.matrix);
            dir.set(0,-1,0);
            pos.y += 40;//10 if prob
            self.raycaster.set(pos,dir);

            const intersect = self.raycaster.intersectObjects(collisionArray);
            if (intersect.length>0){
                let targetY = null;
                let index = 0;
                if (intersect[0].object.player && intersect.length>1)
                    index = 1;
                    targetY = pos.y - intersect[index].distance;
                if (self.group.position.y < targetY){
                    self.velocityY = 0;
                    self.group.position.y = targetY;
                    self.jumping = false;
                }
            }
            if (self.group.position.y>0){
                if (self.velocityY==undefined) self.velocityY = 0;
                self.velocityY -= dt*self.gravity;
            }
            else if (self.group.position.y < 0 && !self.ropeClimbing){
                self.velocityY = 0;
                self.group.position.y = 0;
                self.jumping = false;
            }
            if (self.velocityY <= 0 && self.jumping){

        camera.position.x = self.target.x + self.radius * Math.sin(self.theta * Math.PI / 180) * Math.cos(self.phi * Math.PI / 180);
        camera.position.y = self.target.y + self.radius * Math.sin(self.phi * Math.PI / 180);
        camera.position.z = self.target.z + self.radius * Math.cos(self.theta * Math.PI / 180) * Math.cos(self.phi * Math.PI / 180);
        camera.updateMatrix();

        camera.lookAt(self.target);

        var temp3 = new THREE.Vector3().copy(cameraInfront.position);

        self.model.children[3].children[1].children[0].rotation.x = 0.1;

        //aim raycaster
        let d = new THREE.Vector3();
        let vec1 = new THREE.Vector3().copy(camera.position);
        let vec2 = new THREE.Vector3().copy(cameraInfront.position);
        vec2.applyMatrix4(camera.matrix);
        d.subVectors( vec2, vec1 ).normalize();
        var pos = camera.position.clone();
        self.raycaster.set(pos,d);

        // shoot
        if (input.shoot == true && self.cooldown <= 0 && !touchDevice  && !self.ropeClimbing){
            const intersect = self.raycaster.intersectObjects(cityArray);
            if (intersect.length>0){
                if (Sound.shoot.sound.isPlaying)

                    if (intersect[0].object.health <= 0 && !intersect[0].object.dead){
                        intersect[0].object.die();

                        new Cash(intersect[0].object.localToWorld(intersect[0].object.position));

                    }
                }

            }
        }
        // TOUCH AUTO FIRE
        else if (touchDevice && self.cooldown <= 0 && !self.ropeClimbing){
            const intersect = self.raycaster.intersectObjects(cityArray);
            if (intersect.length>0){
                let v = new THREE.Vector3().copy(self.group.position);
                /*if (self.audio_shoot.isPlaying)
                    self.audio_shoot.stop();
                self.audio_shoot.play();*/

                    setTimeout(function(){

                    },10);

                    let s  = new Shell(v);
                    //v.x += 10;

                    let trail = new BulletTrail(v,intersect[0].point);

                    self.shoot.stop();
                    self.shoot.play();

                    let randomDamage = rand(9,21);
                    intersect[0].object.health -= randomDamage;
                    if (intersect[0].object.health <= 0 && !intersect[0].object.dead){
                        intersect[0].object.die();
                        intersect[0].object.dead = true;
                        self.kills ++;
                        new Cash(intersect[0].object.localToWorld(intersect[0].object.position));
                        new Cash(intersect[0].object.localToWorld(intersect[0].object.position));
                    }

                    if (!touchDevice  && !intersect[0].object.dead){
                        new DamageText(intersect[0].object.position, String(randomDamage));
                        new BloodParticles(intersect[0].point);
                    }

                }
            }
        }
        self.cooldown -= (dt*60);
    }
    self.update = function(delta) {
        self.mixer.update(delta);
        self.boundingBox.setFromObject(self.box);
        self.box3.setFromObject(self.box);
        /*self.cameraBehindWall();*/
        if (!self.dead) {
            HEALTHBAR.style.width = self.health+"%";
            self.move(delta);
            if (!self.jumping && input.jump && !self.ropeClimbing){
                self.falling = false;
                self.jumping = true;
                self.velocityY = 700;
                Sound.jump.sound.play();
            }
        }
        input.jump = false;
        if (self.group.position.y < 200 && !self.ropeClimbing)
            self.collisionWithWall();

        if (self.health <= 0 && !self.dead){
            self.mixer.stopAllAction();
            self.die.play();
            self.dead = true;
            gameOverFunction();
            HEALTHBAR.style.width = 0+"%";
        }
        self.enemiesRaycastFix();

        // failed rope throw
        if (!self.ropeClimbing && self.ropeTarget){
            self.ropeTarget.lerp(self.group.position, 0.1);
            if (self.rope){
                scene.remove(self.rope);
                self.rope = null;
            }
            let curve = new THREE.LineCurve3(
                self.group.position,
                self.ropeTarget
            );

                console.log("delete");
                self.ropeTarget = null;
                console.log(typeof(self.ropeTarget));
                scene.remove(self.rope);
            }
        }
        if (self.ropeClimbing){
            if (self.rope){
                scene.remove(self.rope);
                self.rope = null;
            }
            self.group.position.lerp(self.ropeTarget,2*delta);
            self.model.rotation.x = THREE.Math.degToRad(60);

                self.group.position,
                self.ropeTarget
            );

            if (self.group.position.distanceTo(self.ropeTarget) < 40) {

                self.ropeTarget = null;
                scene.remove(self.rope);

                self.falling = false;
                self.jumping = true;

            }

    self.ropeThrow = function(){
        if (self.ropeClimbing || typeof(self.ropeTarget) != "object") return;
        if (Sound.rope.sound.isPlaying)
            Sound.rope.sound.stop();
        Sound.rope.sound.play();
        // getting target position
        let d = new THREE.Vector3();
        let vec1 = new THREE.Vector3().copy(camera.position);
        let vec2 = new THREE.Vector3().copy(cameraInfront.position);
        vec2.applyMatrix4(camera.matrix);
        d.subVectors( vec2, vec1 ).normalize();
        var pos = self.group.position.clone();
        pos.y += 40;
        self.raycaster.set(pos,d);

        const intersect = self.raycaster.intersectObjects(cityArray);
        if (intersect.length>0 && intersect[0].object.rope){
            self.ropeTarget = new THREE.Vector3().copy(intersect[0].point);
            self.ropeClimbing = true;
            self.ropeTemp = true;
        }
        else{
            self.ropeTarget = new THREE.Vector3().addVectors ( pos, d.multiplyScalar( 5000 ) );
            self.ropeTemp = true;
        }
    }
    self.cameraMove = function(deltaX, deltaY){
        self.theta -= deltaX * (self.sensitivity.x / 2);
        self.theta %= 360;
        self.phi += deltaY * (self.sensitivity.y / 2);
        self.phi = Math.min(50, Math.max(-50, self.phi)); //85 for 180degree motion
        self.cameraBehindWall();
    }
    self.cameraBehindWall = function (){
        if (camera.position.y < 35) return;
        // Camera behing wall
        let d = new THREE.Vector3();
        camera.getWorldDirection(d);
        d.negate();
        let p = camera.position.clone();
        camera.raycaster.set(p,d);
        let c = camera.raycaster.intersectObjects(collisionArray);
        let collision = false;

        if (c.length>0 && !c[0].object.player){
            if (c[0].distance<250){
                self.targetRadius = self.t_targetRadius;
                collision = true;
            }
        }

        if (!collision){
            d.negate();
            camera.raycaster.set(p,d);
            let c2 = camera.raycaster.intersectObjects(collisionArray);
            if (c2.length>0 && !c2[0].object.player){
                if (c2[0].distance<250){
                    collision = true;
                }
            }
        }

        if (!collision && self.targetRadius != self.o_targetRadius) {
            self.targetRadius = self.o_targetRadius;
        }

    }
    self.collisionWithWall = function(direction,dt){
        for (let i in collisionArray){
            let child = collisionArray[i];
            if (child instanceof THREE.Mesh) {
                collision = self.box3.intersectsBox(child.box3);
                if (collision){
                    // if col with pickup return
                    if (child.box3.gun){
                        for (let a in pickupsArr){
                            if (pickupsArr[a].box.uuid == child.uuid){
                                if (child.box3.health){
                                    self.health = 100;
                                }
                                else {
                                    self.gun.visible = false;
                                    self.bazooka.visible = true;
                                    self.bazookaActive = true;
                                }
                                scene.remove(pickupsArr[a].group);
                                pickupsArr.splice(a,1);
                                collisionArray.splice(i,1);
                                return;
                            }
                        }
                    }
                    if (child.box3.jump){
                        self.velocityY = 1600;
                        if (child.position.z < 1000)
                            self.oppositeZ = true;
                        self.velocityZ = 2300;
                        /*if (!self.audio_jump.isPlaying)
                            self.audio_jump.play();*/
                        return;
                    }

                    var overlapX = Math.min( self.box3.max.x, child.box3.max.x ) - Math.max( self.box3.min.x, child.box3.min.x );

                    if ( overlapX < 0 ) return false;

                    var overlapY = Math.min( self.box3.max.y, child.box3.max.y ) - Math.max( self.box3.min.y, child.box3.min.y );

                    if ( overlapY < 0 ) return false;

                    var overlapZ = Math.min( self.box3.max.z, child.box3.max.z ) - Math.max( self.box3.min.z, child.box3.min.z );

                    if ( overlapZ < 0 ) return false;

                    var minOverlap = Math.min( overlapX, overlapZ );
                    var x = y = z = 0;

                    switch ( minOverlap ) {

                        case overlapX:

                            x = Math.sign( self.box3.min.x + self.box3.max.x - child.box3.min.x - child.box3.max.x );
                            self.group.position.x += (x * minOverlap);
                            break;

                        case overlapY:

                            y = Math.sign( self.box3.min.y + self.box3.max.y - child.box3.min.y - child.box3.max.y );
                            break;

                        case overlapZ:

                            z = Math.sign( self.box3.min.z + self.box3.max.z - child.box3.min.z - child.box3.max.z );
                            self.group.position.z += (z * minOverlap);
                            break;


                    }

                    /*return {

                        minOverlap: minOverlap,
                        mtvX: x,
                        mtvY: y,
                        mtvZ: z,

                    };*/
                }
            }
        }
    }
    self.enemiesRaycastFix = function(){

        let o = {distance: 0, pos: new THREE.Vector3()};
        for (let i in enemiesArray){

            if (self.line)

                intersect[0].object.canSee = true;
                intersect[0].object.distance = intersect[0].distance;
            }
            var temp3 = new THREE.Vector3().copy(enemiesArray[i].position);
            enemiesArray[i].localToWorld(temp3)
            let dis = self.group.position.distanceTo(temp3);
            if (o.distance > dis){
                o.distance = dis;
                o.pos = temp3;
            }
        }
        arrow.lookAt(temp3);
        self.sin += 0.18;

    }
    self.hitFX = function() {
        HIT_FX.style.visibility = "visible";

}

function HitFX(spawnPos){
    var self = {
        tex: null,
        sprite: null,
        frame: 1,
        frameY: 1,
        id: Math.random()*100,
        displayDuration: 4,
        currentDisplayDuration: 0,
    }
    self.init = function() {
        self.tex = Textures.hit.texture.clone();
        self.tex.needsUpdate = true;

        let spriteMaterial = new THREE.SpriteMaterial({map:self.tex, rotation: rand(0,5), /*depthTest: false, transparent: true, opacity: 0.8*/});
        self.sprite = new THREE.Sprite(spriteMaterial);
        self.sprite.scale.set(130,130,130);

        self.sprite.position.copy(spawnPos);
        self.sprite.position.y += 10;
        self.sprite.visible = false;
        scene.add(self.sprite);

        self.tilesHorizontal = 4;
	    self.tilesVertical = 4;
        self.numberOfTiles = 16;

        self.tex.wrapS = self.tex.wrapT = THREE.RepeatWrapping;
        self.tex.repeat.set(1 / self.tilesHorizontal, 1 / self.tilesVertical);
        self.currentTile = 0;

    }
    self.update = function(millisec){
        if (!self.sprite) return;
        self.currentDisplayDuration += millisec;

        if (self.currentDisplayDuration > self.displayDuration){
            if (!self.sprite.visible)
                self.sprite.visible = true;

            self.currentDisplayDuration -= self.displayDuration;


            if (self.currentTile == self.numberOfTiles-1){
				scene.remove(self.sprite);
                for (let i in updateArray) {
                    if (updateArray[i].id == self.id){
                        updateArray.splice(i,1);
                    }
                }

            }
			let currentColumn = self.currentTile % self.tilesHorizontal;
			self.tex.offset.x = currentColumn / self.tilesHorizontal;
			let currentRow = 3-Math.floor( self.currentTile / self.tilesHorizontal );
			self.tex.offset.y = currentRow / self.tilesVertical;
            self.currentTile++;
            /*if (self.frame == 3){
                if (self.frameY < 3){
                    self.frameY ++;
                    self.tex.offset.y = self.frameY/4;
                    self.frame = 0;
                    self.tex.offset.x = self.frame/4;
                }
                else {
                    scene.remove(self.sprite);
                    for (let i in hitfxArray) {
                        if (hitfxArray[i].id == self.id){
                            hitfxArray.splice(i,1);
                        }
                    }
                }
            }
            else {
                self.tex.offset.x = self.frame/4;
                self.tex.offset.y = self.frameY/4;
                self.frame += 1;
            }*/
        }
    }

    self.init();
    hitfxArray.push(self);
    return self;
}

function BulletTrail(startVec, endVec) {
    var self = {
        dead: false,
        rope: null,
        start: new THREE.Vector3().copy(startVec),
        end: new THREE.Vector3().copy(endVec),
        speedRatio: 0,
    }
    self.init = function(){
        let d = self.start.distanceTo(self.end);
    }
    self.update = function(dt){
        if (self.rope){
            scene.remove(self.rope);
            self.rope = null;
        }
        self.start.lerp(self.end,20*dt);
        let curve = new THREE.LineCurve3(
            self.start,
            self.end
        );
        self.rope = new THREE.Mesh(new THREE.TubeBufferGeometry(curve, 3, 3, 5, false), new THREE.MeshBasicMaterial({ color: 0xfa7d09,}));
        scene.add(self.rope);

        if (self.start.distanceTo(self.end) < 10) {
            self.dead = true;
            scene.remove(self.rope);
            for (let i in bulletFX){
                if (bulletFX[i].dead){
                    bulletFX.splice(i,1);
                }
            }
        }
    }

    if (touchDevice) return;
    self.init();
    bulletFX.push(self);
    return self;
}

function Shell(spawnPos) {
    var self = {
        velocityY: 200,
        timer: 45,
    }
    self.init = function(){
        self.model = BaseModel.shell.fbx.clone();
        scene.add(self.model);
        // material
        self.model.traverse(function ( child ) {
            if ( child.isMesh ){
                child.material =  new THREE.MeshBasicMaterial( {map: Textures.gun.texture});
            }
        });
        self.model.position.copy(spawnPos);
    }
    self.update = function(dt){
        self.timer --;
        if (self.timer < 0){
            scene.remove(self.model);
            for (let i in updateArray){
                if (updateArray[i].model && updateArray[i].model.uuid == self.model.uuid){
                    updateArray.splice(i,1);
                }
            }
        }
        let gravity = 1000;
        self.model.position.x += dt*150;
        self.model.position.y += dt*self.velocityY;

        self.model.rotation.y += dt*20;
        if (self.model.position.y>0){
            if (self.velocityY==undefined) self.velocityY = 0;
            self.velocityY -= dt*gravity;
        }
        else if (self.model.position.y < 0){
            self.velocityY = 0;
            self.model.position.y = 0;
        }
    }

    if (touchDevice) return;
    self.init();
    updateArray.push(self);
    return self;
}

function DamageText(spawnPos, text) {
    var self = {
        timer: 0,
    }
    self.init = function(){
        const ctx = document.createElement('canvas').getContext('2d');
        const borderSize = 2;
        const font =  `700 30px Arial`;
        ctx.font = font;
        // measure how long the name will be
        const textWidth = ctx.measureText(text).width;
        const doubleBorderSize = borderSize * 2;
        const width = 50 + doubleBorderSize;
        const height = 30 + doubleBorderSize;
        ctx.canvas.width = width;
        ctx.canvas.height = height;
        ctx.font = font;

        // need to set font again after resizing canvas
        ctx.textBaseline = 'middle';
        ctx.textAlign = 'center';
        // scale to fit but don't stretch
        const scaleFactor = Math.min(1, 50 / textWidth);
        ctx.translate(width / 2, height / 2);
        ctx.scale(scaleFactor, 1);
        ctx.fillStyle = '#FF3333';
        ctx.strokeStyle = '#CC0000';
        ctx.lineWidth = 3;
        ctx.strokeText(text, 0, 0);
        ctx.fillText(text, 0, 0);

        const texture = new THREE.CanvasTexture(ctx.canvas);
        texture.encoding = THREE.sRGBEncoding;
        texture.minFilter = THREE.LinearFilter;
        texture.wrapS = THREE.ClampToEdgeWrapping;
        texture.wrapT = THREE.ClampToEdgeWrapping;
        spriteMaterial = new THREE.SpriteMaterial({map:texture});
        self.nameSprite = new THREE.Sprite(spriteMaterial);
        scene.add(self.nameSprite);
        const labelBaseScale = 0.01;
        self.nameSprite.scale.x =  width;
        self.nameSprite.scale.y =  height;
        let vec = new THREE.Vector3().copy(spawnPos);
        vec.y += 30;
        self.nameSprite.position.copy(vec);
    }
    self.update = setInterval(function(){

        self.nameSprite.position.y += 3;
        self.timer ++;
        if (self.timer > 30){
            scene.remove(self.nameSprite);
            clearInterval(self.update);
        }
    },1000/60);

    self.init();
    return self;
}

function BloodParticles(spawnPos){
    var self = {
        particles: [],
        max: 10,
        mesh: null,
        index: null,
    }
    self.init = function() {
        let geo = new THREE.Geometry();
        for(let i=0; i<self.max; i++) {
            let particle = {
                position: new THREE.Vector3(
                      rand(-6, 6),
                      rand(-6, 6),
                      rand(-2, 2)),
                velocity: new THREE.Vector3(
                      rand(-3, 3),
                      2,
                      rand(-3, 3)),
                acceleration: new THREE.Vector3(0, -0.2, 0),
            }
            self.particles.push(particle)
            geo.vertices.push(particle.position)
        }
        var mat = new THREE.PointsMaterial({color:0xFF3300,size: 70, map: Textures.blood.texture, opacity: 0.6, transparent: true,})
        self.mesh = new THREE.Points(geo,mat)
        self.mesh.position.copy(spawnPos);
        scene.add(self.mesh);
    }
    self.update = function(){
        self.particles.forEach(p => {
            p.velocity.add(p.acceleration);
            p.position.add(p.velocity);
            self.mesh.material.size -= 0.2;
        })
        self.mesh.geometry.verticesNeedUpdate = true;
        if (self.mesh.material.size < 0){
            scene.remove(self.mesh);
            for (let i in bloodFXArr){
                if (bloodFXArr[i].mesh.uuid == self.mesh.uuid)
                    bloodFXArr.splice(i,1);
            }

        }
    }

    self.init();
    bloodFXArr.push(self);
    return self;
}

function Enemy(spawnPos){
    var self = {
        group: null,
        model: null,
        mixer: null,
        theta: 2,
        phi: 2,
        sensitivity: new THREE.Vector2(1,1),
        radius: 500,
        o_targetRadius: 220,
        t_targetRadius: 10,
        target: new THREE.Vector3(0,100,0),
        targetRadius: 180,
        speed: 500,
        gun: null,
        cooldown: 0,
        gravity: 2000,
        boundingBox: null,
        spdX: 0,
        spdZ: 0,
        jumping: false,
        jumpTarget: 0,
        health: 100,
        falling: true,
        velocityY: 0,
        velocityZ: 0,
        dead: false,
        kills: 0,
        bazookaActive: false,
        oppositeZ: false,
        jumpCooldown: 100,
        targetAngle: Math.random() * 3,
        vec1: new THREE.Vector3(),
        vec2: new THREE.Vector3(),
        direction: new THREE.Vector3(),
        position: new THREE.Vector3(),
        canSeePlayer: false,
        walkSpeed: 350,
        wallRotateCooldown: 0,
        shootingCooldown: 0,
        enemy: true,
    }
    self.init = function() {
        self.group = new THREE.Object3D();
        scene.add(self.group);
        self.group.position.copy(spawnPos);
        self.group.rotation.y = THREE.Math.degToRad(rand(0,360));

        self.model = THREE.SkeletonUtils.clone(playerModel.model);
        self.model.traverse(function ( child ) {
            if ( child.isMesh ){
                const oldMat = child.material;
                child.material = new THREE.MeshBasicMaterial( {
                    color: 0x000000,
                    skinning: true,
                });
            }
        });
        self.group.add(self.model);

        // anim
        self.mixer = new THREE.AnimationMixer(self.model);
        const firstClip = playerModel.animation;
        const SecondClip = Anims.forward.animation;
        const ThirdClip = Anims.back.animation;
        const FourthClip = Anims.left.animation;
        const FifthClip = Anims.right.animation;
        const SixthClip = Anims.shoot.animation;
        const SeventhClip = Anims.die.animation;
        self.idle = self.mixer.clipAction(firstClip);
        self.forward = self.mixer.clipAction(SecondClip);
        self.back = self.mixer.clipAction(ThirdClip);
        self.left = self.mixer.clipAction(FourthClip);
        self.right = self.mixer.clipAction(FifthClip);
        self.shoot = self.mixer.clipAction(SixthClip);
        self.die = self.mixer.clipAction(SeventhClip);
        self.forward.play();

        self.die.setLoop( THREE.LoopOnce );
        self.die.clampWhenFinished = true;

        self.shoot.setLoop( THREE.LoopOnce );
        self.shoot.clampWhenFinished = true;

        self.die._clip.name = "die";
        self.mixer.addEventListener( 'finished', function( e ) {
            if (e.action._clip.name == "die"){
                scene.remove(self.group);
            }
        });


        // prop-GUN
        self.gun = BaseModel.gun.fbx.clone();
        self.gun.traverse(function ( child ) {
            if ( child.isMesh ){
                child.material =  new THREE.MeshBasicMaterial();
                child.material.map = Textures.gun.texture;
            }
        });
        self.gun.scale.set(1.4,1.4,1.4);
        self.gun.position.set(30,35,-10);
        self.gun.rotation.x = Math.PI/1.5;
        self.model.children[3].children[1].children[0].children[0].children[2].children[0].add(self.gun);

        // muzzle FX
        let p = new THREE.PlaneGeometry( 500, 300, 300 );
        let m = new THREE.MeshBasicMaterial( {transparent: true, side: THREE.DoubleSide, map: Textures.muzzle.texture,} );
        self.muzzle = new THREE.Mesh( p, m );
        self.gun.add(self.muzzle);

        self.muzzle.rotation.y = 1;
        self.muzzle.rotation.x = Math.PI/2;
        self.muzzle.position.x = 120;
        self.muzzle.visible = false;

        // PROPS - shadow
        var circleGeometry = new THREE.CircleGeometry(50, 10, 15);
        var shadowMaterial = new THREE.MeshBasicMaterial({
            map: Textures.shadow.texture,
            transparent: true,
            opacity: 0.4,
            depthTest: false
        });
        self.shadow = new THREE.Mesh(circleGeometry, shadowMaterial);
        self.shadow.rotation.x = -2;
        self.group.add(self.shadow);
        self.shadow.position.y += 8;

        // marker

        let spriteMaterial = new THREE.SpriteMaterial({map:Textures.markerRed.texture});
        self.marker = new THREE.Sprite(spriteMaterial);
        self.group.add(self.marker);
        self.marker.scale.set(25,20,25);
        self.marker.position.y += 110;
        self.marker.position.x -= 10;

        // raycaster
        self.raycaster = new THREE.Raycaster();

        // boundingbox
        const geometry = new THREE.BoxGeometry(30, 95, 30);
        const material = new THREE.MeshBasicMaterial({visible: false, });
        self.box = new THREE.Mesh(geometry, material);
        self.box.canSee = false;
        self.box.distance = 0;
        self.box.position.y += 45;
        self.group.add(self.box);
        self.box.enemy = true;
        self.box.die = function(){
            self.mixer.stopAllAction();
            //enemy[i].die.fadeIn(0.3);
            self.die.play();
            self.box.dead = true;
            for (let i in cityArray){
                if (cityArray[i].dead){
                    cityArray.splice(i,1);
                }
            }
            for (let i in enemiesArray){
                if (enemiesArray[i].dead){
                    enemiesArray.splice(i,1);
                }
            }
            for (let i in updateArray){
                if (updateArray[i].group && updateArray[i].group.box && updateArray[i].group.box.dead){
                    updateArray.splice(i,1);
                }
            }
        }
        self.box.health = 100;
        self.box.dead = false;

        self.boundingBox = new THREE.BoxHelper(self.box, 0x00ff00);
        //scene.add(self.boundingBox);

        self.box3 = new THREE.Box3().setFromObject(self.box);;
        enemiesArray.push(self.box);
        cityArray.push(self.box);
    }
    self.moveAndShoot = function(dt) {
        // move
        if (self.box.canSee){
            if (self.jumpCooldown < 0){
                self.jumpCooldown = 100;
                self.velocityY = 700;
            }
            self.group.lookAt(player.group.position)
            if (self.box.distance > 250)
                self.group.translateZ(self.walkSpeed*dt);
            else
                self.group.translateZ(-self.walkSpeed*dt);

            // Shooting
            if (self.shootingCooldown < 0 && self.box.distance < 2000){
                let v = new THREE.Vector3().copy(self.group.position);
                let t = new THREE.Vector3().copy(player.group.position);
                t.y += 50;
                /*if (self.audio_shoot.isPlaying)
                    self.audio_shoot.stop();
                self.audio_shoot.play();*/


                self.muzzle.visible = true;
                setTimeout(function(){
                    self.muzzle.visible = false;
                },10);

                v.y += 65;
                let s  = new Shell(v);
                //v.x += 10;

                let trail = new BulletTrail(v,t);
                self.shootingCooldown = 10;
                self.shoot.stop();
                self.shoot.play();

                if (rand(0,10)>7){
                    if (Sound.self_hit.sound.isPlaying)
                        Sound.self_hit.sound.stop();
                    Sound.self_hit.sound.play();
                    let randomDamage = rand(2,9);
                    player.health -= randomDamage;

                    if (!touchDevice){
                        new BloodParticles(t);
                    }
                }
            }

        }
        else {
             self.group.translateZ(self.walkSpeed*dt);
        }
        self.box.canSee = false;

    }
    self.jump = function(dt) {
        self.group.position.y += dt*self.velocityY;

        if (self.group.position.y>0){
            self.velocityY -= dt*self.gravity;
        }
        else if (self.group.position.y < 0){
            self.velocityY = 0;
            self.group.position.y = 0;
        }

    }
    self.update = function(delta) {
        self.mixer.update(delta);
        self.boundingBox.setFromObject(self.box);
        self.box3.setFromObject(self.box);
        if (!self.box.dead){
            self.moveAndShoot(delta);
            self.collisionWithWall(delta);
            self.jump(delta);
        }
        self.wallRotateCooldown -= 20*delta;
        self.jumpCooldown -= 60*delta;
        self.shootingCooldown -= 40*delta;
    }
    self.collisionWithWall = function(direction,dt){
        for (let i in collisionArray){
            let child = collisionArray[i];
            if (child instanceof THREE.Mesh) {
                collision = self.box3.intersectsBox(child.box3);
                if (collision){
                    if (self.wallRotateCooldown < 0 && !self.box.canSee){
                        self.group.rotation.y = THREE.Math.degToRad(rand(0,360));
                        self.wallRotateCooldown = 30;
                    }
                    var overlapX = Math.min( self.box3.max.x, child.box3.max.x ) - Math.max( self.box3.min.x, child.box3.min.x );

                    if ( overlapX < 0 ) return false;

                    var overlapY = Math.min( self.box3.max.y, child.box3.max.y ) - Math.max( self.box3.min.y, child.box3.min.y );

                    if ( overlapY < 0 ) return false;

                    var overlapZ = Math.min( self.box3.max.z, child.box3.max.z ) - Math.max( self.box3.min.z, child.box3.min.z );

                    if ( overlapZ < 0 ) return false;

                    var minOverlap = Math.min( overlapX, overlapZ );
                    var x = y = z = 0;

                    switch ( minOverlap ) {

                        case overlapX:

                            x = Math.sign( self.box3.min.x + self.box3.max.x - child.box3.min.x - child.box3.max.x );
                            self.group.position.x += (x * minOverlap);
                            break;

                        case overlapY:

                            y = Math.sign( self.box3.min.y + self.box3.max.y - child.box3.min.y - child.box3.max.y );
                            break;

                        case overlapZ:

                            z = Math.sign( self.box3.min.z + self.box3.max.z - child.box3.min.z - child.box3.max.z );
                            self.group.position.z += (z * minOverlap);
                            break;
                    }
                }
            }
        }
    }
    self.init();
    updateArray.push(self);
    //cityArray.push(self);
    return self;
}

function Cash(spawnPos){
    var self = {
        group: null,
        model: null,
        group2: null,
        model2: null,
        health: true,
        money: true,
    }
    self.init = function() {
        self.group = new THREE.Object3D();
        scene.add(self.group);
        self.model = BaseModel.cash.fbx.clone();
        self.model.traverse(function ( child ) {
            if ( child.isMesh ){
                child.material = new THREE.MeshBasicMaterial( {
                    map: Textures.money.texture,
                });
            }
        });
        self.group.add( self.model );
        self.group.scale.set(3.5,3.5,3);
        self.group.position.set(spawnPos.x+rand(-30,-70),30,spawnPos.z+rand(-60,60));
        self.boundingBox = new THREE.BoxHelper(self.model, 0x00ff00);
        self.box3 = new THREE.Box3().setFromObject(self.model);

        self.group2 = new THREE.Object3D();
        scene.add(self.group2);
        self.model2 = BaseModel.medkit.fbx.clone();
        self.model2.traverse(function ( child ) {
            if ( child.isMesh ){
                child.material = new THREE.MeshBasicMaterial( {
                    map: Textures.equipment.texture,
                });
            }
        });
        self.group2.add( self.model2 );
        self.group2.scale.set(0.82,0.82,0.82);
        self.group2.position.set(spawnPos.x+rand(30,70),30,spawnPos.z+rand(-60,60));
        self.boundingBox2 = new THREE.BoxHelper(self.model2, 0x00ff00);
        self.box32 = new THREE.Box3().setFromObject(self.model2);
    }
    self.update = function(dt){
        if (!player.box3) return;
        self.group.rotation.y += 5*dt;
        self.boundingBox.setFromObject(self.model);
        self.box3.setFromObject(self.model);

        self.group2.rotation.y += 5*dt;
        self.boundingBox2.setFromObject(self.model2);
        self.box32.setFromObject(self.model2);

        if (self.money){
            let collision = self.box3.intersectsBox(player.box3);
            if (collision){
                score += 10;
                scoreFX();
                scene.remove(self.group);
                self.money = false;
                Sound.pickup.sound.play();
            }
        }

        if (self.health){
            let collision = self.box32.intersectsBox(player.box3);
            if (collision){
                player.health = 100;
                healthFX();
                scene.remove(self.group2);
                self.health = false;
                Sound.pickup.sound.play();
            }
        }

        if (!self.money && !self.health){
            for (let i in updateArray){
                if (updateArray[i].money == false && updateArray[i].health  == false){
                    updateArray.splice(i,1);
                }
            }
        }
    }

    self.init();
    updateArray.push(self);
    return self;
}
