<!-- Resource loading shim - handles missing game assets gracefully -->
<script>
(function() {
  // Intercept XMLHttpRequest to handle missing resources
  var originalXhrOpen = XMLHttpRequest.prototype.open;
  var originalFetch = window.fetch;
  var missingResources = {};

  XMLHttpRequest.prototype.open = function(method, url) {
    // Check if this is a resource request with "undefined" in the path
    if (typeof url === 'string' && url.includes('/undefined/')) {
      console.warn("Intercepted request with undefined path:", url);
      // Mark as handled but don't block
    }
    return originalXhrOpen.apply(this, arguments);
  };

  window.fetch = function() {
    var url = arguments[0];
    var promise = originalFetch.apply(this, arguments);
    
    return promise.then(function(response) {
      // If a resource with "undefined" in path returns 404, return empty response
      if (response.status === 404 && typeof url === 'string' && url.includes('/undefined/')) {
        console.warn("Missing resource (not blocking):", url);
        // Return empty blob for missing HTML/text files
        if (url.includes('.html') || url.includes('.txt')) {
          return new Response(new Blob([''], { type: 'text/html' }), {
            status: 200,
            statusText: 'OK (Polyfilled)'
          });
        }
        // Return empty array buffer for binary files
        return new Response(new ArrayBuffer(0), {
          status: 200,
          statusText: 'OK (Polyfilled)'
        });
      }
      return response;
    }).catch(function(err) {
      // If request to undefined path fails, create a polyfilled response
      if (typeof url === 'string' && url.includes('/undefined/')) {
        console.warn("Request failed (polyfilling):", url, err);
        return new Response(new Blob([''], { type: 'text/html' }), {
          status: 200,
          statusText: 'OK (Polyfilled)'
        });
      }
      return Promise.reject(err);
    });
  };

  // Copy properties to maintain compatibility
  if (originalFetch.blob) window.fetch.blob = originalFetch.blob;
  if (originalFetch.formData) window.fetch.formData = originalFetch.formData;
})();
</script>
    
    
<script>
(function(){
  var totalBuildSizeMb = 135.6;
  var loadingScreen = null;
  var isLoaded = false;
  var hasError = false;

  function getLoadingScreen() {
    if (!loadingScreen) {
      loadingScreen = document.getElementById("loading-screen");
    }
    return loadingScreen;
  }

  function hideLoadingScreen() {
    var screen = getLoadingScreen();
    if (screen && !hasError) {
      screen.style.opacity = "0";
      screen.style.transition = "opacity 0.3s ease";
      setTimeout(function() {
        screen.style.display = "none";
      }, 300);
    }
  }

  function showError(message) {
    hasError = true;
    var errorEl = document.getElementById("loading-error");
    if (errorEl) {
      errorEl.textContent = message;
      errorEl.style.display = "block";
    }
    console.error("Game Loading Error:", message);
  }

  function resizeUnityContainer() {
    var c = document.getElementById("unityContainer");
    if (c) { c.style.width = window.innerWidth + "px"; c.style.height = window.innerHeight + "px"; }
  }

  function updateLoadingProgress(progress) {
    var bar = document.getElementById("loading-bar");
    var percent = document.getElementById("loading-percent");
    var text = document.getElementById("loading-text");
    
    // Ensure progress is a valid number
    progress = typeof progress === "number" && !isNaN(progress) ? progress : 0;
    var clamped = Math.max(0, Math.min(1, progress));
    
    if (bar) {
      bar.style.width = (clamped * 100) + "%";
    }
    
    if (percent) {
      var percentValue = Math.round(clamped * 100);
      percent.textContent = percentValue + "%";
    }
    
    if (text) {
      var loadedMb = clamped * totalBuildSizeMb;
      text.textContent = "Downloading: " + loadedMb.toFixed(1) + " / " + totalBuildSizeMb.toFixed(1) + " MB";
    }
  }

  // Listen for Service Worker progress updates as a fallback for Unity's loader
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.addEventListener('message', function(event) {
      if (event.data.type === 'PROGRESS_UPDATE') {
        var data = event.data;
        if (data.url.includes('BATIM.data.unityweb')) {
          var progress = data.loaded / data.total;
          updateLoadingProgress(progress);
        }
      }
    });
  }

  // Set initial state
  window.addEventListener("resize", resizeUnityContainer);
  resizeUnityContainer();
  updateLoadingProgress(0);

  // Monitor for network errors
  var originalFetch = window.fetch;
  var failedRequests = {};
  
  window.fetch = function() {
    var promise = originalFetch.apply(this, arguments);
    var url = arguments[0];
    
    return promise.then(function(response) {
      if (response.status >= 400) {
        failedRequests[url] = response.status;
        // Don't block loading for 404s during initial load
        if (response.status === 404 && !isLoaded) {
          console.warn("Missing resource (will retry):", url, response.status);
        }
      }
      return response;
    }).catch(function(error) {
      failedRequests[url] = error.message;
      return Promise.reject(error);
    });
  };

  try {
    UnityLoader.instantiate("unityContainer", "Build/BATIM.json", {
      cacheControl: {
        dataUrl: "immutable",
        wasmCodeUrl: "immutable",
        wasmFrameworkUrl: "immutable"
      },
      onProgress: function(progress) {
        updateLoadingProgress(progress);
        if (typeof UnityProgress === "function") {
          UnityProgress.apply(null, arguments);
        }
      },
      Module: {
        onRuntimeInitialized: function() {
          isLoaded = true;
          hideLoadingScreen();
          console.log("Unity game loaded successfully");
          if (window.parent && window.parent !== window) {
            window.parent.postMessage({ type: 'GAME_READY' }, '*');
          }
        }
      },
      onerror: function(e) {
        showError("Failed to load game. The game files may be incomplete. Error: " + (e ? e.toString() : "Unknown error"));
      }
    });

    // Set timeout for error handling
    setTimeout(function() {
      if (!isLoaded && !hasError) {
        var screenEl = document.getElementById("loading-screen");
        if (screenEl && screenEl.style.display !== "none") {
          showError("Loading is taking longer than expected. The game files may be corrupted or incomplete. Please refresh the page.");
        }
      }
    }, 120000); // 2 minutes timeout

  } catch (err) {
    showError("Failed to initialize game loader. " + err.message);
  }
})();
</script>
