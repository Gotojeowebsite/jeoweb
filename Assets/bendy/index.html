<!DOCTYPE html>
<html lang="en-us">

<head>
    <script>
        const originalFetch = window.fetch;
        window.fetch = function() {
            if (arguments[0] && typeof arguments[0] === 'string' && arguments[0].includes('undefined/pages/home.html')) {
                return Promise.resolve(new Response(''));
            }
            return originalFetch.apply(this, arguments);
        };
        const originalXHR = XMLHttpRequest.prototype.open;
        XMLHttpRequest.prototype.open = function() {
            if (arguments[1] && typeof arguments[1] === 'string' && arguments[1].includes('undefined/pages/home.html')) {
                arguments[1] = 'data:,';
            }
            return originalXHR.apply(this, arguments);
        };
    </script>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Unity WebGL Player | Bendy and the Ink Machine</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <style>
        * {
            margin: 0;
            padding: 0;
            border: 0;
            overflow: hidden;
        }

        body {
            background: #231F20;
            position: fixed;
            width: 100%;
            height: 100%;
        }

        .webgl-content {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        #unityContainer {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        .fullscreen {
            cursor: pointer;
            display: inline-block;
            width: 24px;
            height: 24px;
            background: url('TemplateData/fullscreen.png') no-repeat center;
            position: absolute;
            bottom: 10px;
            right: 10px;
            z-index: 100;
        }

        #loading-overlay {
            color: white;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1000;
            background: rgba(0,0,0,0.8);
            padding: 30px;
            border-radius: 10px;
            border: 2px solid #555;
            min-width: 300px;
        }

        #loading-text {
            font-size: 24px;
            margin-bottom: 10px;
        }

        #loading-progress {
            font-size: 48px;
            font-weight: bold;
            color: #fbc02d;
        }

        .progress-bar {
            width: 100%;
            height: 10px;
            background: #333;
            margin-top: 15px;
            border-radius: 5px;
            overflow: hidden;
        }

        #progress-fill {
            width: 0%;
            height: 100%;
            background: #fbc02d;
            transition: width 0.2s;
        }
    </style>
    <script src="TemplateData/UnityProgress.js"></script>
    <script src="Build/UnityLoader.js"></script>
    <script>
        function updateProgress(percent, label) {
            const text = document.getElementById("loading-text");
            const count = document.getElementById("loading-progress");
            const fill = document.getElementById("progress-fill");
            if (text) text.textContent = label || "LOADING...";
            if (count) count.textContent = Math.round(percent) + "%";
            if (fill) fill.style.width = percent + "%";
        }

        function mergeFiles(fileParts) {
            return new Promise((resolve, reject) => {
                let buffers = [];
                let totalParts = fileParts.length;

                function fetchPart(index) {
                    if (index >= totalParts) {
                        updateProgress(100, "PREPARING ENGINE...");
                        setTimeout(() => {
                            let mergedBlob = new Blob(buffers);
                            let mergedFileUrl = URL.createObjectURL(mergedBlob);
                            resolve(mergedFileUrl);
                        }, 100);
                        return;
                    }

                    const label = `DOWNLOADING ASSETS (${index + 1}/${totalParts})`;
                    // We simulate progress within the part since fetch doesn't give easy progress for small chunks without stream
                    // But we can update the base percentage
                    const basePercent = (index / totalParts) * 100;
                    updateProgress(basePercent, label);

                    fetch(fileParts[index]).then((response) => {
                        if (!response.ok) throw new Error(`HTTP ${response.status} on ${fileParts[index]}`);
                        return response.arrayBuffer();
                    }).then((data) => {
                        buffers.push(data);
                        fetchPart(index + 1);
                    }).catch(reject);
                }
                fetchPart(0);
            });
        }

        function getParts(file, start, end) {
            let parts = [];
            for (let i = start; i <= end; i++) {
                parts.push(file + ".part" + i);
            }
            return parts;
        }

        function resizeUnityContainer() {
            var container = document.getElementById("unityContainer");
            if (container) {
                container.style.width = window.innerWidth + "px";
                container.style.height = window.innerHeight + "px";
            }
        }

        window.addEventListener('resize', resizeUnityContainer);

        document.addEventListener('DOMContentLoaded', function() {
            resizeUnityContainer();
            
            mergeFiles(getParts("Build/BATIM.data.unityweb", 1, 7)).then((dataUrl) => {
                window.dataUrll = dataUrl;
                updateProgress(100, "STARTING BENDY...");
                
                var json = {
                    "companyName": "DefaultCompany",
                    "productName": "OldCh2RippedTwo",
                    "productVersion": "1.0",
                    "dataUrl": dataUrl,
                    "wasmCodeUrl": "BATIM.wasm.code.unityweb",
                    "wasmFrameworkUrl": "BATIM.wasm.framework.unityweb",
                    "graphicsAPI": ["WebGL 2.0", "WebGL 1.0"],
                    "webglContextAttributes": { "preserveDrawingBuffer": false },
                    "splashScreenStyle": "Dark",
                    "backgroundColor": "#231F20",
                    "developmentBuild": false,
                    "multithreading": false,
                    "unityVersion": "2019.4.17f1"
                };
                
                let blob = new Blob([JSON.stringify(json)], { type: 'application/json' });
                let blobUrl = URL.createObjectURL(blob);
                
                UnityLoader.instantiate("unityContainer", blobUrl, {
                    onProgress: function(instance, progress) {
                        // Progress here is 0 to 1
                        const totalProgress = 100; // After merging we just show completion or handle secondary load
                        if (progress < 1) {
                            updateProgress(progress * 100, "INITIALIZING ENGINE...");
                        }
                    },
                    url: blobUrl,
                    Module: {
                        onRuntimeInitialized: function() {
                            resizeUnityContainer();
                            var overlay = document.querySelector("#loading-overlay");
                            if (overlay) overlay.remove();
                        }
                    }
                });
            }).catch(err => {
                console.error("Failed to merge game files:", err);
                const text = document.getElementById("loading-text");
                const count = document.getElementById("loading-progress");
                if (text) text.textContent = "ERROR LOADING ASSETS";
                if (count) count.textContent = "!!!";
                if (text) text.style.color = "#ff5252";
            });
        });
    </script>
</head>

<body>
    <div class="webgl-content">
        <div id="loading-overlay">
            <div id="loading-text">PREPARING ASSETS...</div>
            <div id="loading-progress">0%</div>
            <div class="progress-bar">
                <div id="progress-fill"></div>
            </div>
        </div>
        <div id="unityContainer"></div>
        <div class="fullscreen" onclick="document.getElementById('unityContainer').requestFullscreen()"></div>
    </div>
</body>

</html>
