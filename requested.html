<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Requested Games - Jeo Unblocked Games</title>
	<link rel="stylesheet" href="styles.css" />
	<style>
		.req-page {
			max-width: 1200px;
			margin: 0 auto;
			padding: 28px 20px;
		}
		.req-toolbar {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 12px;
			flex-wrap: wrap;
			margin-bottom: 18px;
		}
		.req-actions {
			display: flex;
			align-items: center;
			gap: 10px;
			flex-wrap: wrap;
		}
		.req-empty {
			text-align: center;
			padding: 44px 20px;
			color: var(--text-muted, #888);
			font-size: 1rem;
		}
		.req-count {
			color: var(--text-muted, #888);
			font-size: 0.9rem;
			font-weight: 500;
			margin-left: 4px;
		}
		.request-link {
			display: inline-flex;
			align-items: center;
			gap: 8px;
			padding: 8px 14px;
			border: 1px solid var(--border);
			border-radius: 999px;
			text-decoration: none;
			color: var(--text);
			background: var(--card-bg);
			font-size: 0.88rem;
			font-weight: 600;
			transition: border-color 0.2s, color 0.2s;
		}
		.request-link:hover {
			color: var(--accent);
			border-color: var(--accent);
		}
	</style>
</head>
<body class="theme-dark">
	<div class="req-page">
		<div class="req-toolbar">
			<div class="req-actions">
				<a href="index.html" class="back-link">← Back</a>
				<a href="https://forms.gle/HgkCSEzaF5iULyfv8" target="_blank" rel="noopener noreferrer" class="request-link">➕ Request a Game / Report a Bug</a>
			</div>
		</div>

		<section id="requestedSection" class="carousel-section hidden">
			<div class="carousel-header">
				<div class="carousel-title-group">
					<span class="carousel-icon">📋</span>
					<h1 class="carousel-title">Requested Games</h1>
					<span id="requestedCount" class="carousel-count">0</span>
				</div>
			</div>
			<div class="carousel-track-wrap">
				<button class="carousel-arrow carousel-arrow-left" data-target="requestedTrack" aria-label="Scroll left">‹</button>
				<div id="requestedTrack" class="carousel-track"></div>
				<button class="carousel-arrow carousel-arrow-right" data-target="requestedTrack" aria-label="Scroll right">›</button>
			</div>
		</section>

		<div id="emptyMsg" class="req-empty" style="display:none;">No requested games yet - check back soon.</div>
	</div>

	<script>
	(async () => {
		const theme = localStorage.getItem('site-theme') || 'dark';
		document.body.className = 'theme-' + theme;

		const fallback = 'notavailable.svg';
		let games = [];

		try {
			const res = await fetch('games_list.json', { cache: 'no-store' });
			if (res.ok) {
				const text = await res.text();
				games = JSON.parse(text.replace(/^\uFEFF/, ''));
			}
		} catch (e) {
			console.warn('Failed to load games list', e);
		}

		const requestedGames = games.filter(g => g && g.requested && g.url);
		const section = document.getElementById('requestedSection');
		const track = document.getElementById('requestedTrack');
		const count = document.getElementById('requestedCount');
		const emptyMsg = document.getElementById('emptyMsg');

		if (requestedGames.length === 0) {
			emptyMsg.style.display = '';
			return;
		}

		section.classList.remove('hidden');
		count.textContent = String(requestedGames.length);

		requestedGames.forEach((g, i) => {
			const name = g.name || 'Unknown Game';
			const imgSrc = g.image || fallback;
			const card = document.createElement('div');
			card.className = 'carousel-card';
			card.style.setProperty('--card-img', "url('" + imgSrc + "')");
			card.style.animationDelay = (i * 0.04) + 's';
			card.innerHTML = '<div class="game-thumb"><img src="' + imgSrc + '" alt="' + name + '" loading="lazy" onerror="this.onerror=null;this.src=\'' + fallback + '\';" /><span class="requested-badge">📩 Requested</span></div><div class="game-card-content"><div class="game-card-title">' + name + '</div></div>';
			card.addEventListener('click', () => { window.location.href = g.url; });
			track.appendChild(card);
		});

		document.querySelectorAll('.carousel-arrow').forEach(btn => {
			btn.addEventListener('click', () => {
				const target = document.getElementById(btn.dataset.target);
				if (!target) return;
				const scrollAmt = target.clientWidth * 0.7;
				const dir = btn.classList.contains('carousel-arrow-left') ? -1 : 1;
				target.scrollBy({ left: dir * scrollAmt, behavior: 'smooth' });
			});
		});
	})();
	</script>
</body>
</html>
